<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AsistQR">
  <!-- Logo de AsistQR: QR estilizado con palomita. El glifo cabe en el 80 % central (zona segura de íconos maskable). -->
  <rect width="512" height="512" fill="#1a73e8"/>

  <!-- Patrones de esquina del QR. -->
  <g fill="#ffffff">
    <rect x="116" y="116" width="84" height="84" rx="16"/>
    <rect x="312" y="116" width="84" height="84" rx="16"/>
    <rect x="116" y="312" width="84" height="84" rx="16"/>
  </g>
  <g fill="#1a73e8">
    <rect x="130" y="130" width="56" height="56" rx="8"/>
    <rect x="326" y="130" width="56" height="56" rx="8"/>
    <rect x="130" y="326" width="56" height="56" rx="8"/>
  </g>
  <g fill="#ffffff">
    <rect x="144" y="144" width="28" height="28" rx="4"/>
    <rect x="340" y="144" width="28" height="28" rx="4"/>
    <rect x="144" y="340" width="28" height="28" rx="4"/>
  </g>

  <!-- Módulos sueltos del QR. -->
  <g fill="#ffffff">
    <rect x="212" y="116" width="24" height="24" rx="4"/>
    <rect x="244" y="148" width="24" height="24" rx="4"/>
    <rect x="212" y="180" width="24" height="24" rx="4"/>
    <rect x="276" y="180" width="24" height="24" rx="4"/>
    <rect x="116" y="212" width="24" height="24" rx="4"/>
    <rect x="180" y="212" width="24" height="24" rx="4"/>
    <rect x="244" y="212" width="24" height="24" rx="4"/>
    <rect x="308" y="212" width="24" height="24" rx="4"/>
    <rect x="372" y="212" width="24" height="24" rx="4"/>
    <rect x="148" y="244" width="24" height="24" rx="4"/>
    <rect x="212" y="244" width="24" height="24" rx="4"/>
    <rect x="276" y="244" width="24" height="24" rx="4"/>
    <rect x="340" y="244" width="24" height="24" rx="4"/>
    <rect x="212" y="276" width="24" height="24" rx="4"/>
    <rect x="244" y="308" width="24" height="24" rx="4"/>
    <rect x="212" y="340" width="24" height="24" rx="4"/>
    <rect x="212" y="372" width="24" height="24" rx="4"/>
    <rect x="244" y="372" width="24" height="24" rx="4"/>
  </g>

  <!-- Palomita de asistencia registrada. -->
  <circle cx="346" cy="346" r="54" fill="#ffffff"/>
  <path d="M320 347 L339 366 L373 330" fill="none" stroke="#1a73e8" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
